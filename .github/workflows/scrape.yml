name: Daily Job Scrape

on:
  schedule:
    # GitHub often drops a run scheduled at minute 0 and does not retry it.
    # Three off-peak attempts per hour; the gate skips one when this UTC
    # hour already scraped successfully. Each hour is one board + one role
    # set. If that pass fetches nothing, the scrape step starts again.
    - cron: "13,33,53 * * * *"
  workflow_dispatch:
    inputs:
      boards:
        description: "Boards to scrape"
        required: false
        default: "indeed"
        type: choice
        options:
          - linkedin,indeed
          - indeed,linkedin
          - linkedin
          - indeed
          - all
          - rozee
          - mustakbil
      role_set:
        description: "Which role set to use"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - "1"
          - "2"

concurrency:
  group: daily-job-scrape
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Stay under the next hour so a run cannot sit queued and get cancelled.
    # Manual runs can still use the full 6h when you pick a board yourself.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 55 }}

    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Optional: rebuild the API's Redis jobs snapshot after the run.
      JOBS_CACHE_REFRESH_URL: ${{ secrets.JOBS_CACHE_REFRESH_URL }}
      JOBS_CRON_SECRET: ${{ secrets.JOBS_CRON_SECRET }}
      JOB_SCRAPING_MAX_PAGES_PER_BOARD: ${{ secrets.JOB_SCRAPING_MAX_PAGES_PER_BOARD }}
      JOB_SCRAPING_MAX_JOBS_PER_BOARD: ${{ secrets.JOB_SCRAPING_MAX_JOBS_PER_BOARD }}
      JOB_SCRAPING_DOWNLOAD_DELAY: ${{ secrets.JOB_SCRAPING_DOWNLOAD_DELAY }}
      JOB_STALE_AFTER_DAYS: ${{ secrets.JOB_STALE_AFTER_DAYS }}
      JOB_SCRAPING_WORKERS: "2"
      JOB_SCRAPING_MAX_CONCURRENT_FETCHES: "1"
      JOB_SCRAPING_RETRY_BACKOFF_SECONDS: ${{ secrets.JOB_SCRAPING_RETRY_BACKOFF_SECONDS }}
      JOB_SCRAPING_FETCH_TIMEOUT_SECONDS: "0"
      JOB_SCRAPING_FETCH_RETRIES: "0"
      JOB_SCRAPING_FETCH_RETRY_DELAY_SECONDS: "8"
      JOB_SCRAPING_NETWORK_IDLE: "true"
      JOB_SCRAPING_DETAIL_NETWORK_IDLE: "true"
      JOB_SCRAPING_FETCH_ISOLATE: "false"
      JOB_SCRAPING_BROWSER_HARD_TIMEOUT_SECONDS: "0"
      JOB_SCRAPING_DETAIL_HARD_TIMEOUT_SECONDS: "180"
      JOB_SCRAPING_BOARD_TIMEOUT_LIMIT: "3"
      JOB_SCRAPING_BOARD_COOLDOWN_SECONDS: "90"
      JOB_SCRAPING_MAX_DETAIL_FETCHES: "0"
      JOB_SCRAPING_INDEED_INTERACTIVE: "false"
      PERMITTED_ROLES_1: ${{ secrets.PERMITTED_ROLES_1 }}
      PERMITTED_ROLES_2: ${{ secrets.PERMITTED_ROLES_2 }}
      EXCEL_SKILL_GAP: data/skills_master.xlsx
      # Scheduled passes stop themselves after 22 minutes and sync. Two passes
      # fit in the hour, so an empty hour can start again before the next cron.
      JOB_SCRAPING_RUN_BUDGET_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '0' || '1320' }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip if this hour already scraped
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/schedule_gate.py

      - uses: astral-sh/setup-uv@v5
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: uv sync

      - name: Install Playwright browser
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: uv run playwright install --with-deps chromium

      - name: Preflight (secrets + roles)
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: uv run python scripts/validate_ci_env.py

      - name: Run unit tests
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: uv run pytest tests/ -q --tb=line

      - name: Resolve board and role set
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "JOB_SCRAPING_BOARDS=${{ github.event.inputs.boards }}" >> "$GITHUB_ENV"
            ROLE_SET="${{ github.event.inputs.role_set }}"
          else
            # UTC hour % 4 cycles LinkedIn/Indeed and both role sets every hour.
            # 0 LinkedIn set 1, 1 Indeed set 1, 2 LinkedIn set 2, 3 Indeed set 2.
            HOUR=$(date -u +%H)
            SLOT=$((10#$HOUR % 4))
            case "$SLOT" in
              0) BOARD=linkedin; ROLE_SET=1 ;;
              1) BOARD=indeed; ROLE_SET=1 ;;
              2) BOARD=linkedin; ROLE_SET=2 ;;
              3) BOARD=indeed; ROLE_SET=2 ;;
            esac
            echo "JOB_SCRAPING_BOARDS=$BOARD" >> "$GITHUB_ENV"
            echo "Hourly slot UTC ${HOUR}:00 -> ${BOARD}, role set ${ROLE_SET}"
          fi

          if [ "$ROLE_SET" = "1" ]; then
            echo "PERMITTED_ROLES=$PERMITTED_ROLES_1" >> $GITHUB_ENV
          elif [ "$ROLE_SET" = "2" ]; then
            echo "PERMITTED_ROLES=$PERMITTED_ROLES_2" >> $GITHUB_ENV
          else
            python3 -c "
          import json, os
          r1 = json.loads(os.environ.get('PERMITTED_ROLES_1', '[]'))
          r2 = json.loads(os.environ.get('PERMITTED_ROLES_2', '[]'))
          merged = list(dict.fromkeys(r1 + r2))
          print('PERMITTED_ROLES=' + json.dumps(merged))
          " >> $GITHUB_ENV
          fi

      - name: Run scraper
        if: github.event_name != 'schedule' || steps.gate.outputs.scrape == 'true'
        run: |
          set +e
          uv run python -u main.py
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          # main.py exits 2 when this pass fetched no listings. Start again
          # now instead of waiting for the next hour (or a cancelled queue).
          if [ "$code" -eq 2 ]; then
            echo "Nothing fetched this hour; starting the scraper again."
            uv run python -u main.py
            exit $?
          fi
          exit "$code"
